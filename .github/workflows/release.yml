# The tag is the version (Go modules need the `v`). Every push and PR is
# verified; a tag also publishes the GitHub release and points the formula in
# adriangalilea/homebrew-tap at it, through adriangalilea/ci.
name: release

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  verify:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    uses: adriangalilea/ci/.github/workflows/release.yml@c2ba9058dbad2cc8589da7419f2bd8b30ad9334a # v1.2.0
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write

  tap:
    needs: release
    uses: adriangalilea/ci/.github/workflows/tap.yml@c2ba9058dbad2cc8589da7419f2bd8b30ad9334a # v1.2.0
    with:
      formula: ip
      version: ${{ github.ref_name }}
    secrets:
      tap-token: ${{ secrets.TAP_TOKEN }}
